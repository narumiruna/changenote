name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Manage the Release PR or retry the latest publication
        type: choice
        default: manage-pr
        options:
          - manage-pr
          - retry-publication

permissions:
  contents: read

concurrency:
  group: changenote-release-main
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      manage-pr: ${{ steps.route.outputs.manage-pr }}
      publish: ${{ steps.route.outputs.publish }}
      release-commit: ${{ steps.route.outputs.release-commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: Route release operation
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project python scripts/action/route-release.py

  release:
    needs: route
    permissions:
      contents: write
      pull-requests: write
    if: github.ref == 'refs/heads/main' && needs.route.outputs.manage-pr == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Test and build
        run: |
          cargo test --locked
          cargo build --locked --release
          echo "$GITHUB_WORKSPACE/target/release" >> "$GITHUB_PATH"
      - uses: ./
        with:
          base-branch: main

  publish:
    outputs:
      release-commit: ${{ steps.publish.outputs.release-commit }}
    needs: [route, release]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.route.result == 'success' && needs.route.outputs.publish == 'true' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Test and build
        run: |
          cargo test --locked
          cargo build --locked --release
          echo "$GITHUB_WORKSPACE/target/release" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@v7
      - uses: ./preview
        id: preview
        with:
          base-branch: main
      - name: Check selected batch
        env:
          EXPECTED_RELEASE_COMMIT: ${{ needs.route.outputs.release-commit }}
          PREVIEW_RELEASE_COMMIT: ${{ steps.preview.outputs.release-commit }}
          PREVIEW_READY: ${{ steps.preview.outputs.ready }}
        run: uv run --no-project python scripts/action/route-release.py check-preview
      # Recheck the preview selection after publication fetches main, before writes.
      - name: Publish selected batch
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_BASE_BRANCH: main
          EXPECTED_RELEASE_COMMIT: ${{ steps.preview.outputs.release-commit }}
        run: bash scripts/action/publish.sh "$EXPECTED_RELEASE_COMMIT"

  wheels:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.publish.outputs.release-commit != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish.outputs.release-commit }}
          persist-credentials: false
          path: source
      # Build scripts come from this workflow revision, not an older release.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: workflow
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - name: Set release build version
        id: prepare
        shell: bash
        run: |
          version=$(uv run --no-project python workflow/scripts/prepare-python-release.py source)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Create the directory as the runner user before the Linux container writes to it.
      - name: Create distribution directory
        shell: bash
        run: mkdir -p source/dist
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: source
          maturin-version: v1.15.0
          target: ${{ matrix.target }}
          manylinux: 2_17
          args: --release --locked --out dist --compatibility pypi
      - name: Check installed wheel version
        shell: bash
        working-directory: source
        env:
          EXPECTED_VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          actual=$(uvx --isolated --no-index --find-links dist changenote --version)
          test "$actual" = "changenote $EXPECTED_VERSION"
      - name: Build source archive
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: source
          maturin-version: v1.15.0
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: python-${{ matrix.target }}
          path: source/dist/*
          if-no-files-found: error

  pypi:
    needs: [publish, wheels]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.wheels.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/changenote/
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: python-*
          merge-multiple: true
          path: dist
      - uses: astral-sh/setup-uv@v7
      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish --trusted-publishing never --check-url https://pypi.org/simple/ dist/*
