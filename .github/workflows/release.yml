name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Manage the Release PR or retry the latest publication
        type: choice
        default: manage-pr
        options:
          - manage-pr
          - retry-publication

permissions:
  contents: read

# Route every event. An ordinary push must not replace a queued publication.
jobs:
  route:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      manage-pr: ${{ steps.route.outputs.manage-pr }}
      publish: ${{ steps.route.outputs.publish }}
      release-commit: ${{ steps.route.outputs.release-commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Route release operation
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project python scripts/route-release.py

  release:
    needs: route
    concurrency:
      group: changenote-release-pr-main
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    if: github.ref == 'refs/heads/main' && needs.route.outputs.manage-pr == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Test and build
        run: |
          cargo test --locked
          cargo build --locked --release
          echo "$GITHUB_WORKSPACE/target/release" >> "$GITHUB_PATH"
      # Merge https://github.com/changenote/action/pull/1 before this workflow migration.
      - uses: changenote/action@4b2d07126b8a4da4b44aa5fb8256dd81a69e2e3a
        with:
          base-branch: main

  publish:
    outputs:
      release-commit: ${{ steps.publish.outputs.release-commit }}
    needs: route
    concurrency:
      group: changenote-publication-main
      cancel-in-progress: false
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.route.result == 'success' && needs.route.outputs.publish == 'true' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Test and build
        run: |
          cargo test --locked
          cargo build --locked --release
          echo "$GITHUB_WORKSPACE/target/release" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: changenote/action/preview@4b2d07126b8a4da4b44aa5fb8256dd81a69e2e3a
        id: preview
        with:
          base-branch: main
      - name: Check selected batch
        env:
          EXPECTED_RELEASE_COMMIT: ${{ needs.route.outputs.release-commit }}
          PREVIEW_RELEASE_COMMIT: ${{ steps.preview.outputs.release-commit }}
          PREVIEW_READY: ${{ steps.preview.outputs.ready }}
        run: uv run --no-project python scripts/route-release.py check-preview
      # Recheck the preview selection after publication fetches main, before writes.
      # An empty expected commit disables the public guard, so skip an empty batch.
      - name: Publish selected batch
        id: publish
        if: steps.preview.outputs.release-commit != ''
        uses: changenote/action/publish@4b2d07126b8a4da4b44aa5fb8256dd81a69e2e3a
        with:
          base-branch: main
          expected-release-commit: ${{ steps.preview.outputs.release-commit }}

  crates-io:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.publish.outputs.release-commit != '' }}
    concurrency:
      group: changenote-crates-io-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/changenote
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.publish.outputs.release-commit }}
          persist-credentials: false
          path: source
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: workflow
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.12'
      # Use the same validated version and legacy build preparation as wheels.
      - name: Set release build version
        id: prepare
        run: |
          version=$(uv run --no-project python workflow/scripts/prepare-python-release.py source)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish to crates.io
        working-directory: source
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          RELEASE_VERSION: ${{ steps.prepare.outputs.version }}
        run: uv run --no-project python ../workflow/scripts/publish-crate.py . "$RELEASE_VERSION"

  wheels:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.publish.outputs.release-commit != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.publish.outputs.release-commit }}
          persist-credentials: false
          path: source
      # Build scripts come from this workflow revision, not an older release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: workflow
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.12'
      - name: Set release build version
        id: prepare
        shell: bash
        run: |
          version=$(uv run --no-project python workflow/scripts/prepare-python-release.py source)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Create the directory as the runner user before the Linux container writes to it.
      - name: Create distribution directory
        shell: bash
        run: mkdir -p source/dist
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: source
          maturin-version: v1.15.0
          target: ${{ matrix.target }}
          manylinux: 2_17
          args: --release --locked --out dist --compatibility pypi
      - name: Check installed wheel version
        shell: bash
        working-directory: source
        env:
          EXPECTED_VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          actual=$(uvx --isolated --no-index --find-links dist changenote --version)
          test "$actual" = "changenote $EXPECTED_VERSION"
      - name: Build source archive
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: source
          maturin-version: v1.15.0
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-${{ matrix.target }}
          path: source/dist/*
          if-no-files-found: error

  pypi:
    needs: [publish, wheels]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.wheels.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/changenote/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: python-*
          merge-multiple: true
          path: dist
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/*
