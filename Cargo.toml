[package]
name = "changenote"
version = "0.5.0"
edition = "2024"
description = "Language-independent change notes and releases"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1"
getrandom = "0.4"
clap = { version = "4", features = ["derive"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
toml_edit = "0.25"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }

[dev-dependencies]
tempfile = "3"
