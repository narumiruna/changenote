name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: changenote-hooks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@<full-checkout-commit-sha>
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@<full-toolchain-commit-sha>
        with:
          toolchain: stable
      - name: Install trusted CLI
        run: cargo install --git https://github.com/narumiruna/changenote --rev '<full-cli-commit-sha>' --locked
      # Configure project runtimes, dependencies, caches, and registry credentials
      # here. The scripts must test/build the verified source before upload.
      - uses: narumiruna/changenote@<full-action-commit-sha>
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          publish-command: bash scripts/publish.sh
          release-command: bash scripts/release.sh
