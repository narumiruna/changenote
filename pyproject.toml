[project]
name = "changenote"
dynamic = ["version"]
description = "The Rust changenote CLI distributed as a Python package"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[build-system]
requires = ["maturin>=1.15.0,<2"]
build-backend = "maturin"

[tool.maturin]
bindings = "bin"
manifest-path = "Cargo.toml"
python-source = "python"
module-name = "changenote"
strip = true

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "python/changenote/**/*.py" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
]
