[project]
name = "changenote"
dynamic = ["version"]
description = "The Rust changenote CLI distributed as a Python package"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
bindings = "bin"
manifest-path = "crates/changenote/Cargo.toml"
python-source = "python"
module-name = "changenote"
strip = true

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "python/changenote/**/*.py" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/changenote/**/*" },
    { file = "README.md" },
    { file = "LICENSE" },
    { file = "schema.json" },
    { file = "skills/changenote/SKILL.md" },
    { file = "docs/notes.md" },
    { file = "docs/swift.md" },
]
